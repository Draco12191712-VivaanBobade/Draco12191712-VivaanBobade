<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Languages</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      body {
        background: #0d1117;
        color: #c9d1d9;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .card {
        width: 900px;
        margin: 40px auto;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 16px;
        padding: 30px;
      }

      h1 {
        margin-top: 0;
        font-size: 42px;
        color: #58a6ff;
      }

      .bar {
        width: 100%;
        height: 18px;
        display: flex;
        overflow: hidden;
        border-radius: 999px;
        background: #30363d;
        margin: 30px 0;
      }

      .segment {
        height: 100%;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px 50px;
      }

      .lang {
        display: flex;
        align-items: center;
        font-size: 23px;
      }

      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        margin-right: 14px;
        flex-shrink: 0;
      }

      .percent {
        color: #7ee787;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Most Used Languages</h1>

      <div class="bar">
        <div class="segment" style="width: 12%; background: #3178c6"></div>
        <div class="segment" style="width: 10%; background: #f1e05a"></div>
        <div class="segment" style="width: 9%; background: #178600"></div>
        <div class="segment" style="width: 8%; background: #f34b7d"></div>
        <div class="segment" style="width: 7%; background: #e34c26"></div>
        <div class="segment" style="width: 6%; background: #663399"></div>
        <div class="segment" style="width: 5%; background: #292929"></div>
        <div class="segment" style="width: 4%; background: #000080"></div>
        <div class="segment" style="width: 4%; background: #3572a5"></div>
        <div class="segment" style="width: 4%; background: #b07219"></div>
        <div class="segment" style="width: 31%; background: #30363d"></div>
      </div>

      <div class="grid">
        <div class="lang">
          <span class="dot" style="background: #3178c6"></span>TypeScript
          <span class="percent">12%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #f1e05a"></span>JavaScript
          <span class="percent">10%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #178600"></span>C#
          <span class="percent">9%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #f34b7d"></span>C++
          <span class="percent">8%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #e34c26"></span>HTML
          <span class="percent">7%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #663399"></span>CSS
          <span class="percent">6%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #292929"></span>JSON
          <span class="percent">5%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #000080"></span>Lua
          <span class="percent">4%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #3572a5"></span>Python
          <span class="percent">4%</span>
        </div>

        <div class="lang">
          <span class="dot" style="background: #b07219"></span>Java
          <span class="percent">4%</span>
        </div>
      </div>
    </div>
  </body>
</html>
